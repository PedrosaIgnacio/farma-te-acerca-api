services:
  - type: web
    name: farma-te-acerca-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack enable && yarn install --immutable && yarn prisma generate && yarn build && yarn prisma migrate deploy
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
